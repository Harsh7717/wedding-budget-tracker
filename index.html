<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0c5a45" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Wedding Budget" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="description" content="Wedding budget & vendor payment tracker — works offline, data stays on your phone." />
<title>Wedding Budget Tracker</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/favicon-64.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<style>
  :root{
    /* Emerald & Gold */
    --bg1:#f6f3ea; --bg2:#f1f0e4; --bg3:#eef2ec;
    --card:#ffffff; --ink:#243029; --muted:#8a938c;
    --brand:#137a5f; --brand2:#2fa07c; --brand-deep:#0c5a45;
    --gold:#c19a3f; --gold2:#e3c368; --rose:#37a985;   /* --rose kept as accent (now emerald) for focus rings */
    --green:#2e9e6b; --amber:#d9922b; --red:#c9455b;
    --line:#e7ede6; --line2:#e9ecdf;
    --shadow:0 6px 22px rgba(12,90,69,.11);
    --shadow-sm:0 3px 12px rgba(12,90,69,.08);
    --serif:"Iowan Old Style","Palatino Linotype","Palatino","Book Antiqua",Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans);
    background:
      radial-gradient(1200px 500px at 100% -10%, rgba(233,200,119,.16), transparent 60%),
      radial-gradient(900px 500px at -10% 5%, rgba(47,160,124,.16), transparent 55%),
      linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 45%,var(--bg3) 100%);
    background-attachment:fixed;
    color:var(--ink); font-size:15px; line-height:1.45;
    padding-bottom:96px;
  }
  /* Header */
  header{
    background:linear-gradient(135deg,var(--brand-deep) 0%,var(--brand) 55%,var(--brand2) 100%);
    color:#fff; padding:20px 18px 46px; padding-top:calc(20px + env(safe-area-inset-top));
    position:relative; z-index:5;
    border-radius:0 0 26px 26px;
    box-shadow:0 8px 26px rgba(12,90,69,.32);
  }
  header::after{ /* subtle gold hairline */
    content:""; position:absolute; left:18px; right:18px; bottom:30px; height:1px;
    background:linear-gradient(90deg,transparent,rgba(230,200,119,.6),transparent);
  }
  header h1{
    margin:0; font-family:var(--serif); font-size:25px; font-weight:600; letter-spacing:.4px;
    display:flex; align-items:center; gap:9px; text-shadow:0 1px 8px rgba(0,0,0,.15);
  }
  header .sub{opacity:.82; font-size:12px; margin-top:3px; letter-spacing:.2px; font-style:italic}
  .countdown{
    position:relative; display:inline-flex; align-items:center; gap:7px; margin-top:12px;
    background:rgba(255,255,255,.14); border:1px solid rgba(230,200,119,.4);
    color:#fff; padding:7px 13px; border-radius:22px; font-size:13px; font-weight:600; cursor:pointer;
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
  }
  .countdown .ic{width:15px;height:15px;color:var(--gold2)}
  .countdown #cdText b{font-family:var(--serif); font-weight:600; font-size:15px}
  .countdown input[type=date]{
    position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; border:none;
  }
  /* Hero budget card — deliberately distinct from the search bar */
  .hero{
    margin:-34px 16px 4px; position:relative; z-index:8;
    background:linear-gradient(135deg,#fff 0%,#fbfdf9 100%);
    border:1px solid #e3ecdf; border-radius:20px;
    box-shadow:0 12px 30px rgba(12,90,69,.16);
    padding:15px 18px; display:flex; align-items:center; gap:14px;
    overflow:hidden;
  }
  .hero::before{ /* gold edge ribbon */
    content:""; position:absolute; left:0; top:0; bottom:0; width:6px;
    background:linear-gradient(180deg,var(--gold2),var(--gold));
  }
  .hero .ico{font-size:26px; filter:drop-shadow(0 2px 3px rgba(193,154,63,.45))}
  .hero .body{flex:1; min-width:0}
  .hero label{
    display:block; font-size:11px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase;
    color:var(--gold); margin-bottom:2px;
  }
  .hero .inwrap{display:flex; align-items:baseline; gap:3px}
  .hero .cur{font-family:var(--serif); font-size:26px; font-weight:600; color:var(--brand-deep)}
  .hero input{
    border:none; background:transparent; font-family:var(--serif); font-size:26px; font-weight:600;
    color:var(--brand-deep); width:100%; padding:0; letter-spacing:.5px;
  }
  .hero input:focus{outline:none}
  .hero input::placeholder{color:#c3d0c6; font-weight:500}
  /* Summary cards */
  .summary{
    display:grid; grid-template-columns:repeat(2,1fr); gap:11px; padding:14px 16px 4px;
  }
  .scard{
    background:rgba(255,255,255,.82); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    border-radius:17px; padding:13px 14px; box-shadow:var(--shadow-sm);
    border:1px solid rgba(255,255,255,.7); position:relative; overflow:hidden;
  }
  .scard::before{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; opacity:.85}
  .scard.est::before{background:var(--brand2)}
  .scard.paid::before{background:var(--green)}
  .scard.bal::before{background:var(--red)}
  .scard.rem::before{background:var(--gold)}
  .scard .k{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; font-weight:700}
  .scard .v{font-family:var(--serif); font-size:20px; font-weight:600; margin-top:4px}
  .scard.est .v{color:var(--brand)}
  .scard.paid .v{color:var(--green)}
  .scard.bal .v{color:var(--red)}
  .scard.rem .v{color:#b58a2a}
  .scard.rem.over .v{color:var(--red)}
  /* progress */
  .prog-wrap{padding:8px 16px 2px}
  .prog{background:#e2ece4; border-radius:20px; height:15px; overflow:hidden; display:flex; box-shadow:inset 0 1px 3px rgba(12,90,69,.12); border:1px solid rgba(255,255,255,.6)}
  .prog i{display:block; height:100%; transition:width .4s ease}
  .prog .p1{background:linear-gradient(90deg,#2e9e6b,#48c78e)}
  .prog .p2{background:linear-gradient(90deg,#e2a53d,#f0be5f)}
  .prog-legend{display:flex; gap:14px; font-size:11px; color:var(--muted); margin-top:7px; flex-wrap:wrap}
  .prog-legend span{display:flex; align-items:center; gap:5px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
  /* Toolbar */
  .toolbar{display:flex; gap:8px; padding:14px 16px 6px; align-items:center}
  .toolbar input.search{
    flex:1; border:1px solid rgba(255,255,255,.8); border-radius:24px; padding:11px 16px 11px 44px; font-size:14px;
    background:rgba(255,255,255,.7); box-shadow:var(--shadow-sm); color:var(--ink);
  }
  .toolbar input.search:focus{outline:none; border-color:var(--rose); box-shadow:0 0 0 3px rgba(47,160,124,.20)}
  .toolbar select{
    border:1px solid rgba(255,255,255,.8); border-radius:14px; padding:10px 8px; font-size:13px;
    background:rgba(255,255,255,.7); color:var(--ink); box-shadow:var(--shadow-sm);
  }
  /* Category groups */
  .catgroup{margin-bottom:18px}
  .cathead{
    display:flex; align-items:center; gap:12px; padding:13px 15px;
    background:linear-gradient(135deg,#ffffff 0%,#f4faf5 100%);
    border:1px solid rgba(255,255,255,.8); border-radius:18px; box-shadow:var(--shadow);
    cursor:pointer; position:relative; overflow:hidden;
  }
  .cathead::before{content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:linear-gradient(180deg,var(--gold2),var(--gold))}
  .cathead .chev{font-size:12px; color:var(--brand2); transition:transform .25s; flex:none}
  .cathead.collapsed .chev{transform:rotate(-90deg)}
  .cathead .cn{flex:1; min-width:0}
  .cathead .catname{font-family:var(--serif); font-weight:600; font-size:18px; color:var(--brand-deep); display:flex; align-items:center; gap:9px}
  .cathead .catname .cnt{font-family:var(--sans); font-size:11px; font-weight:700; color:#fff; background:linear-gradient(135deg,var(--brand),var(--brand2)); border-radius:20px; padding:2px 9px; box-shadow:0 2px 6px rgba(19,122,95,.32)}
  .cathead .catsub{font-size:11.5px; color:var(--muted); margin-top:3px; display:flex; gap:12px; flex-wrap:wrap}
  .cathead .catsub b{font-weight:800; font-family:var(--serif)}
  .cathead .catsub .e{color:var(--ink)} .cathead .catsub .p{color:var(--green)} .cathead .catsub .d{color:var(--red)}
  .cathead .addcat{
    flex:none; width:36px; height:36px; border-radius:50%; border:none;
    background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff;
    font-size:22px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 10px rgba(19,122,95,.35);
  }
  .cathead .addcat:active{transform:scale(.9)}
  .catbody{padding-top:12px; padding-left:4px}
  .catbody.hidden{display:none}
  /* Item cards */
  .list{padding:6px 16px}
  .empty{text-align:center; color:var(--muted); padding:44px 20px; font-size:14px; font-style:italic}
  .empty .big{font-size:46px; margin-bottom:10px; font-style:normal}
  .item{
    background:var(--card); border-radius:18px; padding:15px; margin-bottom:12px;
    box-shadow:var(--shadow); border:1px solid rgba(255,255,255,.8); position:relative; overflow:hidden;
  }
  .item .accent{position:absolute; left:0; top:0; bottom:0; width:5px}
  .item .top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .item .cat{font-family:var(--serif); font-weight:600; font-size:17px; color:var(--ink)}
  .item .vendor{color:var(--muted); font-size:13px; margin-top:2px}
  .badge{font-size:10px; font-weight:700; padding:4px 10px; border-radius:20px; white-space:nowrap; text-transform:uppercase; letter-spacing:.4px}
  .b-paid{background:#e3f5ec; color:var(--green)}
  .b-partial{background:#fdf1de; color:var(--amber)}
  .b-pending{background:#fbe6e9; color:var(--red)}
  .money-row{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:13px; text-align:center}
  .money-row .m{background:linear-gradient(135deg,#f7faf5,#f1f6f0); border-radius:12px; padding:9px 4px; border:1px solid var(--line)}
  .money-row .m .k{font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; font-weight:700}
  .money-row .m .v{font-family:var(--serif); font-size:15px; font-weight:600; margin-top:3px}
  .m.mest .v{color:var(--ink)} .m.mpaid .v{color:var(--green)} .m.mbal .v{color:var(--red)}
  .mini-prog{height:7px; background:#f0e6ec; border-radius:10px; margin-top:11px; overflow:hidden}
  .mini-prog i{display:block; height:100%; background:linear-gradient(90deg,var(--green),#5ac999); transition:width .4s ease}
  .contact{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px}
  .contact a, .contact span.tag{
    font-size:12px; text-decoration:none; color:var(--brand); background:#eef7f1;
    padding:6px 12px; border-radius:20px; display:inline-flex; align-items:center; gap:5px; border:1px solid var(--line);
  }
  .contact a:active{background:#dff0e6}
  .notes{font-size:12.5px; color:#6b756e; margin-top:11px; white-space:pre-wrap; background:linear-gradient(135deg,#f7faf5,#f1f6f0); padding:9px 12px; border-radius:12px; border:1px solid var(--line)}
  .meta{display:flex; gap:12px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); margin-top:11px}
  .item-actions{display:flex; gap:8px; margin-top:13px}
  .item-actions button{
    flex:1; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:12px;
    padding:10px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .item-actions button.del{color:var(--red); border-color:#f3d3d9}
  .item-actions button.pay{color:var(--green); border-color:#cfeadd; background:#f4fbf7}
  .item-actions button:active{transform:scale(.97)}
  /* FAB */
  .fab{
    position:fixed; right:18px; bottom:calc(80px + env(safe-area-inset-bottom)); z-index:30;
    background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; border:none;
    width:62px; height:62px; border-radius:50%; font-size:33px; line-height:1;
    box-shadow:0 8px 22px rgba(19,122,95,.5); cursor:pointer; display:flex; align-items:center; justify-content:center;
    border:2px solid rgba(255,255,255,.35);
  }
  .fab:active{transform:scale(.92)}
  /* bottom bar */
  .bottombar{
    position:fixed; left:0; right:0; bottom:0; z-index:25;
    background:rgba(255,255,255,.86); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-top:1px solid rgba(255,255,255,.8); box-shadow:0 -4px 20px rgba(12,90,69,.09);
    display:flex; padding:9px 12px calc(9px + env(safe-area-inset-bottom)); gap:8px;
  }
  .bottombar button{
    flex:1; border:none; background:transparent; color:var(--brand); border-radius:13px; padding:8px 4px;
    font-size:11px; font-weight:700; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .bottombar button .ic{font-size:19px}
  .bottombar button:active{background:#e7f3ec}
  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(43,29,38,.55); z-index:40; display:none;
    align-items:flex-end; justify-content:center;
  }
  .overlay.show{display:flex}
  .sheet{
    background:#fff; width:100%; max-width:520px; border-radius:22px 22px 0 0; max-height:92vh; overflow-y:auto;
    padding:18px 18px calc(20px + env(safe-area-inset-bottom)); animation:slideup .25s ease;
  }
  @keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet h2{margin:0 0 14px; font-family:var(--serif); font-weight:600; font-size:21px; color:var(--brand-deep); text-align:center}
  .sheet .grab{width:44px; height:5px; background:#e5d5de; border-radius:10px; margin:0 auto 14px}
  .field{margin-bottom:13px}
  .field label{display:block; font-size:11px; font-weight:700; color:var(--brand2); margin-bottom:6px; text-transform:uppercase; letter-spacing:.5px}
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--line); border-radius:13px; padding:12px 13px; font-size:15px; background:#fafcf8; color:var(--ink); font-family:inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--rose); background:#fff; box-shadow:0 0 0 3px rgba(47,160,124,.18)}
  .field textarea{resize:vertical; min-height:60px}
  .field.two{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .field.two > div{margin:0}
  .hint{font-size:11px; color:var(--muted); margin-top:4px}
  .sheet-actions{display:flex; gap:10px; margin-top:8px}
  .sheet-actions button{flex:1; border:none; border-radius:12px; padding:14px; font-size:15px; font-weight:700; cursor:pointer}
  .btn-save{background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff}
  .btn-cancel{background:#f2eaee; color:var(--muted)}
  .btn-save:active,.btn-cancel:active{transform:scale(.98)}
  .calc-note{font-size:12px; color:var(--green); font-weight:600; margin-top:-6px; margin-bottom:12px}
  /* toast */
  .toast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:100px; background:var(--ink); color:#fff;
    padding:11px 18px; border-radius:24px; font-size:13px; z-index:60; opacity:0; transition:opacity .25s, transform .25s;
    pointer-events:none; box-shadow:0 4px 14px rgba(0,0,0,.25); max-width:90%;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px)}
  .hidden{display:none !important}
  input[type=file]{display:none}
  /* Icons (inline SVG) */
  .ic{width:18px;height:18px;flex:none;display:inline-block;vertical-align:-4px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .ic-fill{fill:currentColor;stroke:none}
  .hicon{display:inline-flex} .hicon .ic{width:27px;height:27px}
  .hero .ico{color:var(--gold); display:flex} .hero .ico .ic{width:28px;height:28px}
  .scard .k .ic{width:14px;height:14px;opacity:.7}
  .searchwrap{flex:1; position:relative; display:flex}
  .searchwrap .sic{position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--muted); display:flex}
  .searchwrap .sic .ic{width:17px;height:17px}
  .cathead .addcat .ic{width:20px;height:20px;stroke-width:2}
  .contact .ic{width:14px;height:14px}
  .meta .ic{width:13px;height:13px;vertical-align:-2px;opacity:.75;margin-right:2px}
  .item-actions .ic{width:15px;height:15px;margin-right:3px}
  .bottombar .ic{width:22px;height:22px}
  .empty .big .ic{width:52px;height:52px;color:var(--rose)}
</style>
</head>

  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V4M4 20h16"/><rect class="ic-fill" x="7.5" y="12" width="2.6" height="5" rx="0.6"/><rect class="ic-fill" x="12" y="8.5" width="2.6" height="8.5" rx="0.6"/><rect class="ic-fill" x="16.5" y="10.5" width="2.6" height="6.5" rx="0.6"/></symbol>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var LS_ITEMS="wbt_items_v1", LS_BUDGET="wbt_budget_v1", LS_WDATE="wbt_wdate_v1";
  var items=[], editId=null, collapsedCats={};

  var $=function(id){return document.getElementById(id);};
  function inr(n){
    n = Number(n)||0;
    // Indian grouping
    var s = Math.round(n).toString();
    var neg = s.charAt(0)==='-'; if(neg) s=s.slice(1);
    var last3 = s.length>3 ? s.slice(-3) : s;
    var rest = s.length>3 ? s.slice(0,-3) : '';
    if(rest) last3 = ','+last3;
    rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',');
    return '₹'+(neg?'-':'')+rest+last3;
  }
  function uid(){return 'i'+Math.random().toString(36).slice(2,9);}
  function toast(msg){var t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},1900);}

  function load(){
    try{ items = JSON.parse(localStorage.getItem(LS_ITEMS)||'[]'); }catch(e){ items=[]; }
    if(!Array.isArray(items)) items=[];
    migrate(items);
    var b = localStorage.getItem(LS_BUDGET); if(b!==null) $('totalBudget').value=b;
    var wd = localStorage.getItem(LS_WDATE); if(wd) $('weddingDate').value=wd;
    updateCountdown();
  }
  function updateCountdown(){
    var v=$('weddingDate').value;
    var el=$('cdText');
    if(!v){ el.textContent='Set your wedding date'; return; }
    // parse as local date
    var p=v.split('-'); var wed=new Date(+p[0],+p[1]-1,+p[2]);
    var now=new Date(); var today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
    var days=Math.round((wed-today)/86400000);
    var pretty=fmtDate(v);
    if(days>1) el.innerHTML='<b>'+days+'</b> days to go · '+pretty;
    else if(days===1) el.innerHTML='<b>Tomorrow</b>! · '+pretty;
    else if(days===0) el.innerHTML='<b>Today</b> — congratulations!';
    else el.innerHTML='Married '+Math.abs(days)+' day'+(Math.abs(days)===1?'':'s')+' ago · '+pretty;
  }
  // Older data stored only "cat" (used as Category/Item). Give each item an "item" name so grouping works.
  function migrate(arr){
    arr.forEach(function(it){ if(it && it.cat && it.item===undefined){ it.item=it.cat; } });
  }
  function save(){ localStorage.setItem(LS_ITEMS, JSON.stringify(items)); }
  function saveBudget(){ localStorage.setItem(LS_BUDGET, $('totalBudget').value||''); }

  function statusOf(it){
    if(it.status && it.status!=='auto') return it.status;
    var est=Number(it.est)||0, paid=Number(it.paid)||0;
    if(paid<=0) return 'Pending';
    if(paid>=est && est>0) return 'Paid';
    return 'Partial';
  }
  function balOf(it){ return Math.max(0,(Number(it.est)||0)-(Number(it.paid)||0)); }

  function recalcSummary(){
    var est=0,paid=0;
    items.forEach(function(it){ est+=Number(it.est)||0; paid+=Number(it.paid)||0; });
    var bal=Math.max(0,est-paid);
    var budget=Number($('totalBudget').value)||0;
    $('sEst').textContent=inr(est);
    $('sPaid').textContent=inr(paid);
    $('sBal').textContent=inr(bal);
    var rem = budget - est;
    $('sRem').textContent = budget? inr(rem) : '—';
    var remCard=$('remCard');
    remCard.classList.toggle('over', budget>0 && rem<0);
    remCard.querySelector('.k').textContent = (budget>0 && rem<0)? 'Over Budget' : 'Budget Left';
    // progress based on budget (fallback to est)
    var base = budget>0? budget : est;
    var pPaid = base? Math.min(100, paid/base*100):0;
    var pBal = base? Math.min(100-pPaid, bal/base*100):0;
    $('progPaid').style.width=pPaid+'%';
    $('progBal').style.width=pBal+'%';
    $('lgPaid').textContent=Math.round(pPaid)+'%';
    $('lgBal').textContent=Math.round(pBal)+'%';
  }

  function accentColor(st){ return st==='Paid'?'var(--green)':st==='Partial'?'var(--amber)':'var(--red)'; }

  function render(){
    recalcSummary();
    var q=($('search').value||'').toLowerCase().trim();
    var fs=$('filterStatus').value;
    var sort=$('sortBy').value;
    var arr=items.slice();
    // filter
    arr=arr.filter(function(it){
      var st=statusOf(it);
      if(fs && st!==fs) return false;
      if(q){
        var hay=((it.cat||'')+' '+(it.item||'')+' '+(it.vendor||'')+' '+(it.person||'')+' '+(it.notes||'')).toLowerCase();
        if(hay.indexOf(q)<0) return false;
      }
      return true;
    });
    // sort
    arr.sort(function(a,b){
      if(sort==='est') return (Number(b.est)||0)-(Number(a.est)||0);
      if(sort==='bal') return balOf(b)-balOf(a);
      if(sort==='cat') return (a.cat||'').localeCompare(b.cat||'');
      if(sort==='date') return (a.date||'9999').localeCompare(b.date||'9999');
      return (a._i||0)-(b._i||0);
    });

    var list=$('list');
    if(!items.length){
      list.innerHTML='<div class="empty"><div class="big"><svg class="ic"><use href="#i-flower"/></svg></div>No items yet.<br>Tap + to add your first expense,<br>or tap Sample to see an example.</div>';
      return;
    }
    if(!arr.length){ list.innerHTML='<div class="empty"><div class="big"><svg class="ic"><use href="#i-search"/></svg></div>No matches.</div>'; return; }

    // group by category, preserving current sort order within each group
    var groups=[], gmap={};
    arr.forEach(function(it){
      var c=it.cat||'Uncategorised';
      if(!gmap[c]){ gmap[c]={cat:c, rows:[]}; gmap[c]._i=(it._i||0); groups.push(gmap[c]); }
      gmap[c].rows.push(it);
    });
    // order groups by the chosen sort as well
    groups.sort(function(a,b){
      if(sort==='cat') return a.cat.localeCompare(b.cat);
      if(sort==='est'||sort==='bal'){
        var av=a.rows.reduce(function(s,x){return s+(sort==='bal'?balOf(x):Number(x.est)||0);},0);
        var bv=b.rows.reduce(function(s,x){return s+(sort==='bal'?balOf(x):Number(x.est)||0);},0);
        return bv-av;
      }
      return (a._i||0)-(b._i||0);
    });

    list.innerHTML=groups.map(function(g){
      var gEst=0,gPaid=0;
      g.rows.forEach(function(it){ gEst+=Number(it.est)||0; gPaid+=Number(it.paid)||0; });
      var gBal=Math.max(0,gEst-gPaid);
      var collapsed = collapsedCats[g.cat]?'collapsed':'';
      var bodyHidden = collapsedCats[g.cat]?'hidden':'';
      var head='<div class="cathead '+collapsed+'" data-cat="'+esc(g.cat)+'">'+
        '<span class="chev">▼</span>'+
        '<div class="cn">'+
          '<div class="catname">'+esc(g.cat)+' <span class="cnt">'+g.rows.length+'</span></div>'+
          '<div class="catsub"><span class="e">Est <b>'+inr(gEst)+'</b></span>'+
            '<span class="p">Paid <b>'+inr(gPaid)+'</b></span>'+
            '<span class="d">Due <b>'+inr(gBal)+'</b></span></div>'+
        '</div>'+
        '<button class="addcat" data-addcat="'+esc(g.cat)+'" title="Add item to '+esc(g.cat)+'"><svg class="ic"><use href="#i-plus"/></svg></button>'+
      '</div>';
      var body='<div class="catbody '+bodyHidden+'">'+g.rows.map(itemCard).join('')+'</div>';
      return '<div class="catgroup">'+head+body+'</div>';
    }).join('');
  }

  function itemCard(it){
    var st=statusOf(it), bal=balOf(it), est=Number(it.est)||0, paid=Number(it.paid)||0;
    var pctPaid=est? Math.min(100, paid/est*100):0;
    var badgeCls = st==='Paid'?'b-paid':st==='Partial'?'b-partial':'b-pending';
    var contacts='';
    if(it.phone){
      var tel=it.phone.replace(/[^+\d]/g,'');
      contacts+='<a href="tel:'+esc(tel)+'"><svg class="ic"><use href="#i-phone"/></svg> '+esc(it.phone)+'</a>';
      contacts+='<a href="https://wa.me/'+esc(tel.replace(/^\+/,''))+'" target="_blank" rel="noopener"><svg class="ic"><use href="#i-chat"/></svg> WhatsApp</a>';
    }
    if(it.email){
      if(it.email.indexOf('@')>0) contacts+='<a href="mailto:'+esc(it.email)+'"><svg class="ic"><use href="#i-mail"/></svg> '+esc(it.email)+'</a>';
      else contacts+='<span class="tag"><svg class="ic"><use href="#i-pin"/></svg> '+esc(it.email)+'</span>';
    }
    var meta=[];
    if(it.share) meta.push('<svg class="ic"><use href="#i-target"/></svg>Target '+esc(it.share)+'%');
    if(it.date) meta.push('<svg class="ic"><use href="#i-calendar"/></svg>Due '+fmtDate(it.date));
    if(it.payDates) meta.push('<svg class="ic"><use href="#i-receipt"/></svg>'+esc(it.payDates));
    var title = it.item || it.cat || 'Untitled';
    return '<div class="item">'+
      '<div class="accent" style="background:'+accentColor(st)+'"></div>'+
      '<div class="top"><div><div class="cat">'+esc(title)+'</div>'+
        (it.vendor||it.person?'<div class="vendor">'+esc([it.vendor,it.person].filter(Boolean).join(' • '))+'</div>':'')+
      '</div><span class="badge '+badgeCls+'">'+st+'</span></div>'+
      '<div class="money-row">'+
        '<div class="m mest"><div class="k">Estimated</div><div class="v">'+inr(est)+'</div></div>'+
        '<div class="m mpaid"><div class="k">Paid</div><div class="v">'+inr(paid)+'</div></div>'+
        '<div class="m mbal"><div class="k">Balance</div><div class="v">'+inr(bal)+'</div></div>'+
      '</div>'+
      '<div class="mini-prog"><i style="width:'+pctPaid+'%"></i></div>'+
      (contacts?'<div class="contact">'+contacts+'</div>':'')+
      (meta.length?'<div class="meta">'+meta.map(function(m){return '<span>'+m+'</span>';}).join('')+'</div>':'')+
      (it.notes?'<div class="notes">'+esc(it.notes)+'</div>':'')+
      '<div class="item-actions">'+
        (bal>0?'<button class="pay" data-pay="'+it.id+'"><svg class="ic"><use href="#i-check"/></svg>Mark Paid</button>':'')+
        '<button data-edit="'+it.id+'"><svg class="ic"><use href="#i-edit"/></svg>Edit</button>'+
        '<button class="del" data-del="'+it.id+'"><svg class="ic"><use href="#i-trash"/></svg>Delete</button>'+
      '</div>'+
    '</div>';
  }

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmtDate(d){ if(!d)return''; var p=d.split('-'); if(p.length!==3)return d; var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return p[2]+' '+m[+p[1]-1]+' '+p[0]; }

  // ---- Modal ----
  function refreshCatList(){
    var cats={}; items.forEach(function(it){ if(it.cat) cats[it.cat]=1; });
    var dl=$('catList'); dl.textContent='';
    Object.keys(cats).sort().forEach(function(c){ var o=document.createElement('option'); o.value=c; dl.appendChild(o); });
  }
  function openSheet(it, presetCat){
    editId = it? it.id : null;
    refreshCatList();
    $('sheetTitle').textContent = it? 'Edit Item' : (presetCat? 'Add to '+presetCat : 'Add Item');
    $('fCat').value=it?it.cat||'':(presetCat||''); $('fItem').value=it?it.item||'':'';
    $('fVendor').value=it?it.vendor||'':'';
    $('fPerson').value=it?it.person||'':''; $('fPhone').value=it?it.phone||'':'';
    $('fEmail').value=it?it.email||'':''; $('fShare').value=it?it.share||'':'';
    $('fEst').value=it?it.est||'':''; $('fPaid').value=it?it.paid||'':'';
    $('fStatus').value=it?(it.status||'auto'):'auto'; $('fDate').value=it?it.date||'':'';
    $('fPayDates').value=it?it.payDates||'':''; $('fNotes').value=it?it.notes||'':'';
    updateCalc();
    $('overlay').classList.add('show');
    setTimeout(function(){ (presetCat? $('fItem') : $('fCat')).focus(); },200);
  }
  function closeSheet(){ $('overlay').classList.remove('show'); }
  function updateCalc(){
    var est=Number($('fEst').value)||0, paid=Number($('fPaid').value)||0;
    var bal=Math.max(0,est-paid);
    $('calcNote').textContent = est? ('Balance Due: '+inr(bal)+(paid>est?'  ⚠ Paid exceeds estimate':'')) : '';
  }
  function saveItem(){
    var cat=$('fCat').value.trim();
    var item=$('fItem').value.trim();
    if(!cat){ toast('Category is required'); $('fCat').focus(); return; }
    if(!item){ toast('Item / Sub-category is required'); $('fItem').focus(); return; }
    var data={
      cat:cat, item:item, vendor:$('fVendor').value.trim(), person:$('fPerson').value.trim(),
      phone:$('fPhone').value.trim(), email:$('fEmail').value.trim(),
      share:$('fShare').value.trim(), est:Number($('fEst').value)||0, paid:Number($('fPaid').value)||0,
      status:$('fStatus').value, date:$('fDate').value, payDates:$('fPayDates').value.trim(),
      notes:$('fNotes').value.trim()
    };
    if(editId){
      var idx=items.findIndex(function(x){return x.id===editId;});
      if(idx>=0){ items[idx]=Object.assign(items[idx],data); }
      toast('Updated ✓');
    }else{
      data.id=uid(); data._i=Date.now()+items.length; items.push(data);
      toast('Added ✓');
    }
    save(); render(); closeSheet();
  }

  // ---- Export / Import ----
  function download(name, content, type){
    var blob=new Blob([content],{type:type});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(url); a.remove();},100);
  }
  function exportJson(){
    var payload={ app:'wedding-budget-tracker', version:1, budget:$('totalBudget').value||'', weddingDate:$('weddingDate').value||'', items:items };
    download('wedding-budget-backup.json', JSON.stringify(payload,null,2), 'application/json');
    toast('Backup downloaded');
  }
  function exportCsv(){
    var cols=['Category','Item/Sub-category','Vendor Name','Contact Person','Phone Number','Email/Address','Target % Share','Total Estimated (INR)','Advance Paid (INR)','Balance Due (INR)','Payment Status','Payment Dates','Notes'];
    var rows=[cols.join(',')];
    // sort by category then item for a tidy sheet
    var sorted=items.slice().sort(function(a,b){ return (a.cat||'').localeCompare(b.cat||'')||(a.item||'').localeCompare(b.item||''); });
    sorted.forEach(function(it){
      var r=[it.cat,it.item,it.vendor,it.person,it.phone,it.email,it.share,it.est,it.paid,balOf(it),statusOf(it),it.payDates,it.notes];
      rows.push(r.map(csvCell).join(','));
    });
    // totals row
    var est=items.reduce(function(s,it){return s+(Number(it.est)||0);},0);
    var paid=items.reduce(function(s,it){return s+(Number(it.paid)||0);},0);
    rows.push(['TOTAL','','','','','','',est,paid,Math.max(0,est-paid),'','',''].map(csvCell).join(','));
    download('wedding-budget.csv', '﻿'+rows.join('\r\n'), 'text/csv');
    toast('CSV downloaded');
  }
  function csvCell(v){ v=v==null?'':String(v); return /[",\r\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }
  function importJson(file){
    var reader=new FileReader();
    reader.onload=function(){
      try{
        var d=JSON.parse(reader.result);
        var incoming = Array.isArray(d)? d : d.items;
        if(!Array.isArray(incoming)) throw 0;
        if(!confirm('Restore '+incoming.length+' item(s)? This replaces your current list.')) return;
        items=incoming.map(function(it,i){ it.id=it.id||uid(); if(it._i==null) it._i=i; return it; });
        migrate(items);
        if(d.budget!=null){ $('totalBudget').value=d.budget; saveBudget(); }
        if(d.weddingDate!=null){ $('weddingDate').value=d.weddingDate; localStorage.setItem(LS_WDATE, d.weddingDate||''); updateCountdown(); }
        save(); render(); toast('Restored '+items.length+' items ✓');
      }catch(e){ toast('Could not read that file'); }
    };
    reader.readAsText(file);
  }

  function seed(){
    if(items.length && !confirm('Add sample items to your list?')) return;
    var samples=[
      {cat:'Venue & Banquet',item:'Wedding hall booking',vendor:'Grand Palace Gardens',person:'Mr. Rajesh',phone:'+919876543210',email:'events@grandpalace.in',share:'25',est:500000,paid:150000,status:'auto',date:'2026-11-20',payDates:'Booking advance 5 Aug',notes:'Includes hall + lawn, 500 pax'},
      {cat:'Catering',item:'Dinner buffet (500 pax)',vendor:'Spice Route Caterers',person:'Anita',phone:'+919812345678',email:'hello@spiceroute.in',share:'20',est:400000,paid:0,status:'auto',date:'2026-11-15',payDates:'',notes:'Veg + non-veg, 8 live counters'},
      {cat:'Jewellery',item:'Bridal Necklace Set',vendor:'Tanishq',person:'Store Manager',phone:'+919811223344',email:'Sector 25, Noida',share:'',est:350000,paid:100000,status:'auto',date:'2026-10-25',payDates:'Advance 1 Aug',notes:'Polki + diamond set'},
      {cat:'Jewellery',item:'Gold Bangles (pair)',vendor:'Tanishq',person:'Store Manager',phone:'+919811223344',email:'Sector 25, Noida',share:'',est:180000,paid:0,status:'auto',date:'2026-10-25',payDates:'',notes:'22kt, ~40g'},
      {cat:'Jewellery',item:'Engagement Rings',vendor:'CaratLane',person:'Neha',phone:'+919822334455',email:'DLF Mall',share:'',est:90000,paid:90000,status:'auto',date:'2026-09-10',payDates:'Paid 10 Sep',notes:'His & hers, solitaire'},
      {cat:'Photography & Video',item:'Full coverage package',vendor:'Candid Frames Studio',person:'Vikram',phone:'+919900112233',email:'book@candidframes.in',share:'8',est:150000,paid:150000,status:'auto',date:'2026-10-01',payDates:'Full paid 1 Oct',notes:'Pre-wedding + 2 day coverage, drone'},
      {cat:'Décor & Flowers',item:'Stage & mandap décor',vendor:'Bloom & Bling',person:'Priya',phone:'+919765432100',email:'Sector 18, Noida',share:'12',est:220000,paid:50000,status:'auto',date:'2026-11-18',payDates:'Advance 10 Aug',notes:'Stage, entrance, mandap florals'}
    ];
    samples.forEach(function(s,i){ s.id=uid(); s._i=Date.now()+i; items.push(s); });
    if(!$('totalBudget').value){ $('totalBudget').value='2000000'; saveBudget(); }
    save(); render(); toast('Sample data added');
  }

  // ---- Events ----
  $('fab').onclick=function(){ openSheet(null); };
  $('btnCancel').onclick=closeSheet;
  $('btnSave').onclick=saveItem;
  $('overlay').onclick=function(e){ if(e.target===$('overlay')) closeSheet(); };
  $('fEst').oninput=updateCalc; $('fPaid').oninput=updateCalc;
  $('search').oninput=render; $('filterStatus').onchange=render; $('sortBy').onchange=render;
  $('totalBudget').oninput=function(){ saveBudget(); recalcSummary(); };
  $('weddingDate').onchange=function(){ localStorage.setItem(LS_WDATE, this.value||''); updateCountdown(); };
  $('btnExportJson').onclick=exportJson;
  $('btnExportCsv').onclick=exportCsv;
  $('btnSeed').onclick=seed;
  $('btnImport').onclick=function(){ $('fileInput').click(); };
  $('fileInput').onchange=function(e){ if(e.target.files[0]) importJson(e.target.files[0]); e.target.value=''; };

  $('list').addEventListener('click', function(e){
    // per-category add button
    var addBtn=e.target.closest('[data-addcat]');
    if(addBtn){ e.stopPropagation(); openSheet(null, addBtn.getAttribute('data-addcat')); return; }
    // collapse/expand category header
    var head=e.target.closest('.cathead');
    if(head){
      var c=head.getAttribute('data-cat');
      collapsedCats[c]=!collapsedCats[c];
      head.classList.toggle('collapsed');
      var body=head.parentNode.querySelector('.catbody');
      if(body) body.classList.toggle('hidden');
      return;
    }
    // item action buttons
    var b=e.target.closest('button'); if(!b) return;
    var id=b.getAttribute('data-edit')||b.getAttribute('data-del')||b.getAttribute('data-pay');
    var it=items.find(function(x){return x.id===id;}); if(!it) return;
    if(b.hasAttribute('data-edit')) openSheet(it);
    else if(b.hasAttribute('data-del')){ if(confirm('Delete "'+(it.item||it.cat||'this item')+'"?')){ items=items.filter(function(x){return x.id!==id;}); save(); render(); toast('Deleted'); } }
    else if(b.hasAttribute('data-pay')){ it.paid=Number(it.est)||0; it.status='auto'; save(); render(); toast('Marked as fully paid ✓'); }
  });

  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });

  load(); render();

  // ---- PWA install prompt ----
  var deferredPrompt=null;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault(); deferredPrompt=e;
    var btn=$('btnInstall'); if(btn){ btn.classList.remove('hidden'); }
  });
  var ib=$('btnInstall');
  if(ib){ ib.onclick=function(){
    if(!deferredPrompt){ toast('Use browser menu → Add to Home Screen'); return; }
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){ deferredPrompt=null; ib.classList.add('hidden'); });
  }; }
  window.addEventListener('appinstalled', function(){ if(ib) ib.classList.add('hidden'); toast('Installed'); });
})();

// ---- Service worker (offline) ----
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
